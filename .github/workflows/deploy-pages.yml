name: Deploy Beaver Dan to GitHub Pages

on:
  push:
    branches: [claude/beaver-dan-game-v80gwa]
    paths: ['beaver-dan/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: beaver-dan
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: beaver-dan/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
